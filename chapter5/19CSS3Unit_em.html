<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>3. CSS3 단위</title>
    <style>
        /* p:nth-child(1){} 
        p:nth-child(2){font-size: 100%}
        p:nth-child(3){font-size: 150%}
        p:nth-child(4){font-size: 200%} */

        /* em 단위 적용하기: 배수를 나타내는 단위 >> 1배 = 1em 1.5배 = 1.5em

         p:nth-child(1){}
        p:nth-child(2){font-size: 1.0em}
        p:nth-child(3){font-size: 1.5em}
        p:nth-child(4){font-size: 2.0em} */

        /* p태그의 기본 font-size속성이 16px 이므로 실행결과와 같다 */
        p:nth-child(1){}
        p:nth-child(2){font-size: 16px}
        p:nth-child(3){font-size: 24px}
        p:nth-child(4){font-size: 32px}

        /* 색상단위 */
        h1{background-color: rgb(255 255 0);}  /* RGB 색상*/

        /*RGBA 색상: RGB + Alpha(투명도) 0 완전투명 1 완전불투명 */
        h2{background-color: rgba(255 0 0 / 0.5);}

        /*HEX 색상: RGB색상 단위를 짧게 입력하는 방법. RGB 색상조합을 16진수로 표현 */
        h3{background-color: #00ff00;}
    </style>
</head>
<body>

    <p>Lorem ipsum dolor sit amet consectetur</p>
    <p>Lorem ipsum dolor sit amet consectetur</p>
    <p>Lorem ipsum dolor sit amet consectetur</p>

    <h3>6.3 색상 단위</h3>
</body>
